<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DesignAI KZ — AR</title>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;background:#000;font-family:sans-serif;}
#container{width:100vw;height:100vh;position:relative;}
#hint{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);color:#C9A84C;padding:10px 22px;border-radius:30px;font-size:14px;letter-spacing:1px;z-index:100;border:1px solid rgba(201,168,76,0.4);pointer-events:none;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:0.7;}50%{opacity:1;}}
#logo{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(10,22,40,0.8);color:#C9A84C;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;letter-spacing:1px;z-index:100;border:0.5px solid rgba(201,168,76,0.4);}
</style>
</head>
<body>
<div id="logo">DesignAI KZ · AR</div>
<div id="container"></div>
<div id="hint">📱 Наведи камеру на постер</div>

<script>
const BANNER_URL = "https://omirzakanela-ship-it.github.io/designai-kz/";

document.addEventListener("DOMContentLoaded", async () => {
  const mindarThree = new window.MINDAR.IMAGE.MindARThree({
    container: document.getElementById("container"),
    imageTargetSrc: "https://omirzakanela-ship-it.github.io/designai-kz/targets.mind",
    maxTrack: 1,
  });

  const { renderer, scene, camera } = mindarThree;

  const anchor = mindarThree.addAnchor(0);

  const scenes = [
    { title: "Современные технологии\nв графическом дизайне", sub: "Для дизайнеров Казахстана", color: "#C9A84C" },
    { title: "72% дизайнеров\nиспользуют AI", sub: "Системно — единицы. Курс решает это.", color: "#EF9F27" },
    { title: "5 модулей\n10 занятий", sub: "ChatGPT · Midjourney · DALL·E · Gemini", color: "#C9A84C" },
    { title: "Результат: p<0.05\nn=24 участника", sub: "Рост компетенций подтверждён", color: "#EF9F27" },
  ];

  let currentScene = 0;
  let canvas, ctx, texture, plane;

  function makeCanvas(sceneData) {
    const w = 1024, h = 512;
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const ctx = c.getContext("2d");

    ctx.fillStyle = "#0A1628";
    roundRect(ctx, 0, 0, w, h, 40);
    ctx.fill();

    ctx.strokeStyle = "rgba(201,168,76,0.6)";
    ctx.lineWidth = 3;
    roundRect(ctx, 2, 2, w-4, h-4, 38);
    ctx.stroke();

    ctx.fillStyle = "rgba(201,168,76,0.07)";
    for(let i=0;i<w;i+=40){
      ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,h);
      ctx.strokeStyle="rgba(201,168,76,0.04)";ctx.lineWidth=1;ctx.stroke();
    }

    ctx.fillStyle = sceneData.color;
    ctx.font = "bold 56px sans-serif";
    ctx.textAlign = "center";
    const lines = sceneData.title.split("\n");
    lines.forEach((line, i) => {
      ctx.fillText(line, w/2, 160 + i * 72);
    });

    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.font = "32px sans-serif";
    ctx.fillText(sceneData.sub, w/2, 380);

    ctx.fillStyle = "rgba(201,168,76,0.8)";
    ctx.font = "22px sans-serif";
    ctx.fillText("DesignAI KZ · designai-kz", w/2, 460);

    return c;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }

  canvas = makeCanvas(scenes[0]);
  texture = new THREE.CanvasTexture(canvas);

  const geometry = new THREE.PlaneGeometry(1, 0.5);
  const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
  plane = new THREE.Mesh(geometry, material);
  plane.position.set(0, 0, 0.01);
  anchor.group.add(plane);

  let sceneTimer = 0;
  const SCENE_DUR = 180;

  anchor.onTargetFound = () => {
    document.getElementById("hint").style.display = "none";
  };
  anchor.onTargetLost = () => {
    document.getElementById("hint").style.display = "block";
  };

  renderer.setAnimationLoop(() => {
    sceneTimer++;
    if (sceneTimer >= SCENE_DUR) {
      sceneTimer = 0;
      currentScene = (currentScene + 1) % scenes.length;
      const newCanvas = makeCanvas(scenes[currentScene]);
      texture.image = newCanvas;
      texture.needsUpdate = true;
    }
    const t = sceneTimer / SCENE_DUR;
    const scale = 0.95 + 0.05 * Math.sin(t * Math.PI);
    plane.scale.set(scale, scale, 1);

    renderer.render(scene, camera);
  });

  await mindarThree.start();
});
</script>
</body>
</html>
